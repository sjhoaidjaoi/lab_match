server:
  port: 8080
spring:
  application:
    name: selection-backend
  messages:
    basename: messages
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lab_match?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.labmatch.selection: INFO
