server:
  port: 8080

spring:
  application:
    name: labselect
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.college.labselect.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:labselect-dev-secret-key-0123456789abcdef}
  expire-seconds: ${JWT_EXPIRE_SECONDS:7200}

lab-select:
  default-password: ${INITIAL_PASSWORD:123456}
  upload-dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    com.college.labselect: info
