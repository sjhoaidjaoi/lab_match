
name: Lab Match CI

# 触发条件
on:
  # 任何分支收到代码推送时触发
  push:
    branches:
      - '**'

  # 创建或更新指向任意分支的 Pull Request 时触发
  pull_request:
    branches:
      - '**'

  # 允许管理员手动运行 CI
  workflow_dispatch:

# 工作流权限
permissions:
  contents: read

# 自动化任务
jobs:
  ci:
    name: Project CI
    runs-on: ubuntu-latest

    steps:
      # 第一步：获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：检查项目目录
      - name: Check project structure
        run: |
          echo "Checking Lab Match project..."

          test -d backend || exit 1
          test -d frontend || exit 1
          test -d database || exit 1

          echo "Project structure check passed!"

      # 第三步：输出检查成功信息
      - name: CI completed
        run: echo "Lab Match CI completed successfully!"
